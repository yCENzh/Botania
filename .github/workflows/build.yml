name: Build GoG Skybox Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'zulu'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Setup Workspace and Build
      run: |
        echo "Setting up decompilation workspace..."
        ./gradlew setupDecompWorkspace --no-daemon --stacktrace --info
        echo "Building mod..."
        ./gradlew build --no-daemon --stacktrace --info
      env:
        GRADLE_OPTS: "-Xmx4G -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4G"

    - name: List build outputs
      run: |
        echo "Build completed. Listing outputs:"
        find build -name "*.jar" -type f
        ls -la build/libs/ || echo "No libs directory found"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GoG-Skybox-Build-${{ github.run_number }}
        path: |
          build/libs/*.jar
        retention-days: 30

    - name: Upload to Release (if release)
      if: github.event_name == 'release' && success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Find the main jar file
        JAR_FILE=$(find build/libs -name "*.jar" -not -name "*sources*" -not -name "*javadoc*" | head -1)
        if [ -f "$JAR_FILE" ]; then
          echo "Uploading $JAR_FILE to release"
          gh release upload ${{ github.event.release.tag_name }} "$JAR_FILE"
        else
          echo "No JAR file found to upload"
          exit 1
        fi