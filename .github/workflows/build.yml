name: Build GogSkybox Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Debug - List project files
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo "=== Source directory ==="
        find src -type f -name "*.java" | head -10
        echo "=== Gradle files ==="
        ls -la *.gradle* || true

    - name: Download MC Assets (Workaround)
      run: ./gradlew downloadMcAssets --info
      continue-on-error: true

    - name: Fix Minecraft JAR Downloads
      run: ./gradlew fixMinecraftJars --info
      continue-on-error: true

    - name: Setup Forge Development Workspace
      run: ./gradlew setupDecompWorkspace --info --continue
      continue-on-error: true

    - name: Build Mod
      run: ./gradlew build --info --continue
      
    - name: Debug - Check build results
      run: |
        echo "=== Build artifacts ==="
        find . -name "*.jar" -type f
        echo "=== Build directory ==="
        ls -la build/libs/ || echo "No build/libs directory found"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gogskybox-mod
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
        retention-days: 30
        
    - name: Final status
      run: |
        echo "Build process completed"
        if [ -f build/libs/GogSkybox-1.0.1.jar ]; then
          echo "✅ Main JAR file created successfully"
          ls -la build/libs/GogSkybox-1.0.1.jar
        else
          echo "❌ Main JAR file not found"
          echo "Available files:"
          find build -name "*.jar" 2>/dev/null || echo "No JAR files found"
        fi
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}