name: Build GogSkybox Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Debug - List project files
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo "=== Source directory ==="
        find src -type f -name "*.java" | head -10
        echo "=== Gradle files ==="
        ls -la *.gradle* || true

    - name: Download MC Assets (Workaround)
      run: ./gradlew downloadMcAssets --info
      continue-on-error: true

    - name: Fix Minecraft JAR Download
      run: ./gradlew fixMinecraftJar --info
      continue-on-error: true

    - name: Setup Forge Development Workspace
      run: ./gradlew setupDecompWorkspace --info --stacktrace --continue
      continue-on-error: true
      
    - name: Alternative Build (if setup fails)
      if: failure()
      run: |
        echo "setupDecompWorkspace failed, trying alternative approach..."
        ./gradlew clean --info
        ./gradlew build --info --continue
      continue-on-error: true
      
    - name: Build with Gradle
      run: ./gradlew build --info --continue
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GogSkybox-${{ github.run_number }}
        path: build/libs/*.jar
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}