name: Build GogSkybox (Fallback)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-home-cache-cleanup: true
        gradle-home-cache-strict-match: false
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Gradle Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Download dependencies
      run: |
        ./gradlew --version
        ./gradlew dependencies --no-daemon
        
    - name: Setup workspace (with retry)
      run: |
        for i in {1..3}; do
          echo "Attempt $i to setup workspace..."
          if ./gradlew setupDecompWorkspace --no-daemon --stacktrace --info; then
            echo "Setup workspace successful on attempt $i"
            break
          else
            echo "Setup workspace failed on attempt $i"
            if [ $i -eq 3 ]; then
              echo "All attempts failed"
              exit 1
            fi
            sleep 10
          fi
        done
        
    - name: Build project
      run: ./gradlew build --no-daemon --stacktrace --info
      
    - name: List build outputs
      run: |
        echo "Build directory contents:"
        ls -la build/libs/ || echo "No libs directory found"
        
    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: gogskybox-${{ github.run_number }}
        path: |
          build/libs/*.jar
        retention-days: 7