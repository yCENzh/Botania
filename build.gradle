buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "1.0.1"
group = "gogsky.core"
archivesBaseName = "GogSkybox"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
    
    // 替换版本占位符
    replaceIn "gogsky/core/GogSkybox.java"
    replace "@VERSION@", project.version
}

repositories {
    maven {
        name = "Chicken Bones Maven"
        url = "http://chickenbones.net/maven/"
    }
    maven {
        name = "Player Maven"
        url = "http://maven.ic2.player.to/"
    }
}

dependencies {
    // 如果需要其他依赖可以在这里添加
}

processResources {
    // 确保当版本变更时重新处理资源
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // 替换mcmod.info中的版本信息
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        
        // 替换版本和MC版本
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // 复制其他资源文件
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// 为GitHub Actions优化的任务
task buildForGithub {
    dependsOn 'build'
    doLast {
        println "Build completed for GitHub Actions"
        println "Jar file location: ${jar.archivePath}"
    }
}

// 确保构建的jar文件包含所有必需的文件
jar {
    manifest {
        attributes 'FMLCorePlugin': 'gogsky.core.GogSkybox'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}